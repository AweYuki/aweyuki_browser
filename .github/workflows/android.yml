name: Chromium Android baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    if: ${{ !github.event.repository.private || vars.CHROMIUM_RUNNER_LABEL != '' }}
    runs-on: ${{ github.event.repository.private && vars.CHROMIUM_RUNNER_LABEL || 'ubuntu-24.04' }}
    env:
      DEPOT_TOOLS_UPDATE: '0'
      PUBLIC_BUILD_ROOT: /opt/chromium-build
    timeout-minutes: 360
    steps:
      - name: Expand disk on public hosted runner
        if: ${{ !github.event.repository.private }}
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          build-mount-path: ${{ env.PUBLIC_BUILD_ROOT }}
          root-reserve-mb: '8192'
          temp-reserve-mb: '3072'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check build host
        shell: bash
        run: |
          test "$(uname -sm)" = 'Linux x86_64'
          nproc
          free -h
          build_root="$RUNNER_TEMP"
          if [[ "$RUNNER_ENVIRONMENT" == 'github-hosted' ]] && mountpoint -q "$PUBLIC_BUILD_ROOT"; then
            build_root="$PUBLIC_BUILD_ROOT"
          fi
          df -h "$build_root"
          available=$(df -B1 --output=avail "$build_root" | tail -1)
          if (( available < 100000000000 )); then
            printf 'Chromium needs 100 GB free; %s bytes available on %s.\n' "$available" "$build_root" >&2
            exit 1
          fi
          printf 'BUILD_ROOT=%s\n' "$build_root" >> "$GITHUB_ENV"

      - name: Fetch pinned Chromium and depot tools
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/ci/chromium.lock"
          cd "$BUILD_ROOT"
          git init -q depot_tools
          git -C depot_tools fetch --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_COMMIT"
          git -C depot_tools checkout --detach FETCH_HEAD
          test "$(git -C depot_tools rev-parse HEAD)" = "$DEPOT_TOOLS_COMMIT"
          export PATH="$BUILD_ROOT/depot_tools:$PATH"
          "$BUILD_ROOT/depot_tools/ensure_bootstrap"
          "$BUILD_ROOT/depot_tools/python-bin/python3" --version
          test "$(git -C depot_tools rev-parse HEAD)" = "$DEPOT_TOOLS_COMMIT"
          printf '%s\n' "$BUILD_ROOT/depot_tools" >> "$GITHUB_PATH"

          mkdir chromium
          cd chromium
          git init -q src
          git -C src remote add origin https://chromium.googlesource.com/chromium/src.git
          git -C src fetch --depth=1 origin "refs/tags/$CHROMIUM_VERSION"
          git -C src checkout --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = "$CHROMIUM_COMMIT"
          gclient config --unmanaged --name=src --custom-var checkout_pgo_profiles=True \
            https://chromium.googlesource.com/chromium/src.git
          printf '\ntarget_os = ["android"]\n' >> .gclient
          gclient sync --no-history --nohooks
          test "$(git -C src rev-parse HEAD)" = "$CHROMIUM_COMMIT"

      - name: Build unmodified ARM64 Chromium
        shell: bash
        run: |
          cd "$BUILD_ROOT/chromium/src"
          build/install-build-deps.sh --android --no-prompt
          gclient runhooks
          mkdir -p out/Baseline
          cp "$GITHUB_WORKSPACE/ci/baseline.gn" out/Baseline/args.gn
          gn gen out/Baseline --fail-on-unused-args
          autoninja -C out/Baseline chrome_public_apk
          git diff --exit-code HEAD --

      - name: Record baseline build metadata
        shell: bash
        run: |
          cd "$BUILD_ROOT/chromium/src"
          mkdir "$RUNNER_TEMP/baseline-artifact"
          cp out/Baseline/apks/ChromePublic.apk out/Baseline/args.gn \
            "$GITHUB_WORKSPACE/ci/chromium.lock" "$RUNNER_TEMP/baseline-artifact/"
          cd "$RUNNER_TEMP/baseline-artifact"
          sha256sum ChromePublic.apk > SHA256SUMS
          printf 'run_id=%s\nrun_attempt=%s\nrunner=%s\nimage=%s\nimage_version=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME" \
            "${ImageOS:-unknown}" "${ImageVersion:-unknown}" > build-info.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-android-arm64-baseline
          path: ${{ runner.temp }}/baseline-artifact/
          if-no-files-found: error
          retention-days: 7
